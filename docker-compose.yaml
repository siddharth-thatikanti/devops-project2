
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mern-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - mern-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      MONGODB_URI: mongodb://mongodb:27017/mern_app
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mern-network

  mongodb:
    image: mongo:8.0.4
    container_name: mern-mongodb
    environment:
      GLIBC_TUNABLES: "glibc.pthread.rseq=0"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - mern-network

volumes:
  mongo_data:

networks:
  mern-network:
    driver: bridge

